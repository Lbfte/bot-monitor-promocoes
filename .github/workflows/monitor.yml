name: Monitor de Promoções

on:
  schedule:
    # A cada 5 minutos (o mínimo permitido). Na prática o GitHub costuma
    # atrasar alguns minutos em horários de pico — é o preço do plano grátis.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Só uma rodada por vez: duas em paralelo repostariam as mesmas promoções.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          SOURCE_CHANNEL: ${{ vars.SOURCE_CHANNEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEST_CHAT_ID: ${{ secrets.DEST_CHAT_ID }}
          SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          SEND_DELAY: ${{ vars.SEND_DELAY }}
          BACKFILL: ${{ vars.BACKFILL }}
          REQUIRE_LINK: ${{ vars.REQUIRE_LINK }}
          ALLOW_KEYWORDS: ${{ vars.ALLOW_KEYWORDS }}
          BLOCK_KEYWORDS: ${{ vars.BLOCK_KEYWORDS }}
          MIN_PRICE: ${{ vars.MIN_PRICE }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          FOOTER_TEXT: ${{ vars.FOOTER_TEXT }}
          INCLUDE_SOURCE_LINK: ${{ vars.INCLUDE_SOURCE_LINK }}
        run: python run_monitor.py

      - name: Salvar estado
        # Roda mesmo se o passo anterior falhar: o que já foi publicado
        # precisa ficar registrado para não ser repostado.
        if: always()
        run: |
          if [[ -z $(git status --porcelain state.json subscribers.json) ]]; then
            echo "Estado inalterado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Só existe depois que alguém se inscreve em algum alerta.
          if [ -f subscribers.json ]; then
            git add subscribers.json
          fi
          git commit -m "chore: estado do monitor [skip ci]"
          # Outra rodada pode ter commitado enquanto esta rodava.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            echo "Push falhou, tentando de novo ($tentativa/3)..."
            sleep 5
          done
          exit 1
